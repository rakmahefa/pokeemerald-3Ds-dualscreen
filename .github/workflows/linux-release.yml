name: Linux Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.3.0); matching upstream WebPayload must exist"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-builder:
    name: Build Linux x86_64 builder and publish it
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version tag such as v0.3.0; got '$TAG'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Check release version matches builder source
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("builder/pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$declared" != "$VERSION" ]]; then
            echo "::error::Release tag is $VERSION but builder/pyproject.toml declares $declared. Update the project version before releasing."
            exit 1
          fi
          python3 -m compileall -q builder/emerald3ds_builder

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev python3-venv python3-tk tk8.6 unzip jq curl

      - name: Download and validate the matching upstream WebPayload
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/upstream-release.json"
          gh api "repos/ZallaxDev/pokeemerald-3Ds-dualscreen/releases/tags/$TAG" > "$release_json"
          if ! jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false' "$release_json" >/dev/null; then
            echo "::error::The matching upstream release $TAG does not exist or is still a draft."
            exit 1
          fi

          asset_url="$(jq -er '[.assets[] | select(.name == "Emerald3DS-WebPayload.zip")][0].browser_download_url' "$release_json")"
          expected_sha256="$(jq -er '[.assets[] | select(.name == "Emerald3DS-WebPayload.zip")][0].digest | select(type == "string" and startswith("sha256:")) | ltrimstr("sha256:")' "$release_json")"
          archive="$RUNNER_TEMP/Emerald3DS-WebPayload.zip"
          curl --fail --silent --show-error --location --retry 3 "$asset_url" --output "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/webpayload"
          unzip -q "$archive" -d "$RUNNER_TEMP/webpayload"
          unpack="$RUNNER_TEMP/webpayload"
          payload="$unpack/payload"
          if ! jq -e --arg version "$VERSION" --arg tag "$TAG" \
            '.releaseVersion == $version and .releaseTag == $tag and (.synthetic != true)' \
            "$unpack/web-manifest.json" >/dev/null; then
            echo "::error::The downloaded WebPayload manifest does not match $TAG."
            exit 1
          fi
          for required in Emerald3DS.3dsx Emerald3DS.smdh emerald3ds.recipe; do
            if [[ ! -f "$payload/$required" ]]; then
              echo "::error::WebPayload is missing payload/$required."
              exit 1
            fi
          done
          if [[ ! -d "$payload/voxelgen" ]] || ! find "$payload/voxelgen" -type f -name '*.py' -print -quit | grep -q .; then
            echo "::error::WebPayload is missing the voxelgen Python scripts."
            exit 1
          fi
          if [[ ! -d "$unpack/licenses" ]]; then
            echo "::error::WebPayload is missing its licenses/ directory."
            exit 1
          fi

      - name: Build portable Linux executable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/linux-venv"
          "$RUNNER_TEMP/linux-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/linux-venv/bin/python" -m pip install Pillow pyinstaller

          cat > "$RUNNER_TEMP/linux_entry.py" <<'PY'
          from emerald3ds_builder.__main__ import main

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          "$RUNNER_TEMP/linux-venv/bin/pyinstaller" \
            --noconfirm --clean --onefile \
            --name Emerald3DS-Builder \
            --paths "$GITHUB_WORKSPACE/builder" \
            --distpath "$RUNNER_TEMP/pyinstaller-dist" \
            --workpath "$RUNNER_TEMP/pyinstaller-work" \
            --specpath "$RUNNER_TEMP/pyinstaller-work" \
            "$RUNNER_TEMP/linux_entry.py"
          "$RUNNER_TEMP/pyinstaller-dist/Emerald3DS-Builder" --version
          "$RUNNER_TEMP/pyinstaller-dist/Emerald3DS-Builder" --help >/dev/null

      - name: Assemble Linux release archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          unpack="$RUNNER_TEMP/webpayload"
          staging="$RUNNER_TEMP/linux-package/Emerald3DS-v${VERSION}-Linux-x86_64"
          mkdir -p "$staging"

          # Use the upstream web payload; no Windows ZIP or Windows executable is required.
          cp -a "$unpack/payload" "$staging/payload"
          cp -a "$unpack/licenses" "$staging/LICENSES"
          install -m 0755 "$RUNNER_TEMP/pyinstaller-dist/Emerald3DS-Builder" "$staging/Emerald3DS-Builder"

          cat > "$staging/README-Linux.txt" <<'EOF'
          Pokémon Emerald 3Ds Dual Screen — Linux builder (x86_64)

          This package contains the native Linux builder and the matching game payload.
          It does not contain a Pokémon ROM or a generated game data pack.

          GUI mode:
            ./Emerald3DS-Builder

          Command line:
            ./Emerald3DS-Builder --help
            ./Emerald3DS-Builder build --rom /path/to/your-emerald.gba --output /path/to/output
            ./Emerald3DS-Builder install --rom /path/to/your-emerald.gba --sd /path/to/3ds-sd-card

          Run this executable from the extracted folder so it can find the adjacent payload/
          directory. Use your own clean, supported Pokémon Emerald cartridge dump. The ROM is
          read locally and is not uploaded or included in this archive.

          This is a Linux x86_64 desktop application. GUI mode needs a graphical desktop
          session. The game it installs is Nintendo 3DS homebrew, not a native Linux game.
          EOF

          asset="$RUNNER_TEMP/Emerald3DS-v${VERSION}-Linux-x86_64.tar.gz"
          tar -C "$RUNNER_TEMP/linux-package" -czf "$asset" "$(basename "$staging")"
          tar -tzf "$asset" >/dev/null
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$(basename "$asset")" >> "$GITHUB_ENV"

      - name: Create or reuse the target GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/target-release.json"
          releases_json="$RUNNER_TEMP/target-releases.json"

          # List releases so drafts are found too; the by-tag endpoint may only
          # return published releases. Create a draft automatically if absent.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
          release_id="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | first | .id // empty' "$releases_json")"
          if [[ -z "$release_id" ]]; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Emerald3DS $TAG — Linux x86_64" \
              --notes "Linux x86_64 builder for Emerald3DS $TAG. Extract the archive and run ./Emerald3DS-Builder from the extracted directory. This package contains no ROM; use your own supported Pokémon Emerald dump."
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
            release_id="$(jq -er --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | first | .id' "$releases_json")"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/release-assets.json"

      - name: Upload Linux archive and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          assets_json="$RUNNER_TEMP/release-assets.json"
          sums="$RUNNER_TEMP/existing-SHA256SUMS.txt"
          checksum_tmp="$RUNNER_TEMP/SHA256SUMS.txt"

          # Preserve checksums for other existing release assets, if present.
          sums_id="$(jq -r '[.[] | select(.name == "SHA256SUMS.txt")][0].id // empty' "$assets_json")"
          if [[ -n "$sums_id" ]]; then
            curl --fail --silent --show-error --location \
              -H 'Accept: application/octet-stream' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$sums_id" \
              --output "$sums"
          else
            : > "$sums"
          fi

          awk -v asset="$ASSET_NAME" '$2 != asset { print }' "$sums" > "$checksum_tmp"
          sha256sum "$ASSET" | awk -v asset="$ASSET_NAME" '{ print $1 "  " asset }' >> "$checksum_tmp"

          # Replace prior copies on re-runs.
          for name in "$ASSET_NAME" "SHA256SUMS.txt"; do
            ids="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' "$assets_json")"
            while IFS= read -r id; do
              [[ -z "$id" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done <<< "$ids"
          done

          upload_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url' | sed 's/{?name,label}$//')"
          for file in "$ASSET" "$checksum_tmp"; do
            name="$(basename "$file")"
            curl --fail --silent --show-error --location --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary "@$file" \
              "$upload_url?name=$name" >/dev/null
          done
          echo "Uploaded $ASSET_NAME and refreshed SHA256SUMS.txt on release $TAG."
          echo "The payload came from ZallaxDev/pokeemerald-3Ds-dualscreen; no Windows ZIP is required."
